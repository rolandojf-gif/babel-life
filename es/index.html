          <div class="masthead">
            <p class="eyebrow">BABEL LIFE</p>
            <h1 class="masthead__heading">
              En algún lugar de la Biblioteca de Babel, toda vida posible ya está escrita.
            </h1>
          </div>
          <p class="static-premise">
            Esta edición abre ochenta y un libros de veintisiete familias narrativas: veintisiete
            libros raíz y cincuenta y cuatro libros cercanos, cada uno con una vida completa. Más allá, la
            Biblioteca se extiende por todas las combinaciones posibles de sus veinticinco
            símbolos.
          </p>
          <p class="notice">
            La Biblioteca interactiva necesita JavaScript. Sin él, esto es cuanto puedes leer de
