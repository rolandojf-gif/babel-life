# Continuous deployment for the Library of Lives.
# The deploy runs `npm run verify`: the typecheck, the tests and the Vite build,
# in that order, so a type error or a failing test fails the deploy rather than
# shipping.

[build]
  command = "npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# English lives at "/" and Spanish at "/es/", both real HTML entries from the
# Vite build. Hash routes stay in the fragment, so there is nothing else to
# rewrite. Canonical Spanish is the trailing-slash URL.

[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301
