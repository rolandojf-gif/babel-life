<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Library of Lives</title>
    <meta
      name="description"
      content="Somewhere in the Library, every writable life already exists. Twenty-four authored volumes, and the nearby lives that differ from them by seconds, sentences and accidents."
    />
    <link rel="stylesheet" href="/src/styles.css" />

  <body>
    <div id="app"></div>
    <noscript>
      <div class="shell">
        <main class="main">
          <div class="masthead">
            <p class="eyebrow">THE LIBRARY OF LIVES</p>
            <h1 class="masthead__heading">
              Somewhere in the Library, every writable life already exists.
            </h1>
          </div>
          <p class="static-premise">
            In one volume you miss the 08:14 by two seconds, and thirty-one years of your life are
            different. In the volume beside it you reach the platform three seconds earlier, board,

            The interactive Library requires JavaScript. Without it, this is the whole of the
            edition you can read.
          </p>
        </main>
        <footer class="footer">
          <p class="attribution">After Jorge Luis Borges.</p>
        </footer>
